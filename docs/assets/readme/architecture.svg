<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Toris Agent architecture from the current implementation</title>
  <desc id="desc">Operator surfaces (CLI/TUI and Studio on 127.0.0.1:5824) feed planner.js, orchestrator.js, isolated worktrees, verifier.js and receipt.js under ~/.toris. Design Mode captures flow through design-proxy.js and design-store.js into POST /api/agent/turn. Optional Android evidence uses android.js with adb argv and lands under ~/.toris/android.</desc>
