  <text x="32" y="36" fill="#ff7657" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="1.6">FROM THIS REPOSITORY</text>
  <text x="32" y="64" fill="#f4efe6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">How Toris turns a goal into evidence</text>
  <text x="32" y="88" fill="#a8b0bc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Labeled from actual modules. Not a mock UI.</text>

