name: release

# A tagged release does three things, in dependency order:
#   1. build the optional native npm packages (one per platform),
#   2. publish them to npm, root package last, and
#   3. build the standalone SEA binaries and attach them — with checksums and
#      the install script — to the GitHub Release the tag created.
#
# The npm handshake is delicate: the platform packages must exist on the
# registry *before* the root package that lists them as optionalDependencies,
# otherwise a fresh `npm install toris-agent` resolves the optional deps to
# nothing and every user silently drops to the JS fallback.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack, but do not publish or create a release
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  # Stage 1: one native build per platform, on a real runner of that platform.
  # No cross-compilation — every triple in scripts/targets.js maps to a runner
  # that is natively that triple, so the toolchain stays boring.
  native:
    name: build ${{ matrix.triple }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: darwin-arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
          - triple: darwin-x64
            runner: macos-13
            rust_target: x86_64-apple-darwin
          - triple: linux-x64-gnu
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - triple: linux-arm64-gnu
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - triple: win32-x64-msvc
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/toris-native

      - name: Build cdylib
        run: >
          cargo build --release
          --manifest-path crates/toris-native/Cargo.toml
          --target ${{ matrix.rust_target }}

      - name: Pack platform package
        run: node scripts/pack-native.js --triple ${{ matrix.triple }}

      # Proving the freshly built binary actually dlopens here is the whole
      # point of the matrix. A .node that packs but fails to load would
      # otherwise only surface on a user's machine as a silent fallback.
      - name: Verify the binary loads
        run: node scripts/verify-native.js --triple ${{ matrix.triple }}

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.triple }}
          path: npm/native-${{ matrix.triple }}
          if-no-files-found: error
          retention-days: 7

  # Stage 2: publish platform packages first, then the root that depends on them.
  publish:
    name: publish to npm
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: npm

      - name: Show what will be published
        run: |
          find npm -name package.json -exec node -e '
            const p = require(process.argv[1]);
            console.log(p.name + "@" + p.version + "  os=" + p.os + "  cpu=" + p.cpu);
          ' {} \;

      # A partial matrix is worse than no release: users on the missing
      # platform get a root package whose optional dep never resolves.
      - name: Refuse to publish an incomplete matrix
        run: |
          # The comparison happens in Node, not in the shell. Passing the count
          # through a shell variable means passing it through Node's stdout
          # formatting, which colourises bare numbers when FORCE_COLOR is set.
          # `[ "$count" -ne "$expected" ]` then dies with "integer expression
          # expected" and the `if` falls through to the *success* path — the
          # gate would wave an incomplete matrix straight past. Fail-open, in
          # the one check whose whole job is to fail closed.
          node -e "
            import('./scripts/targets.js').then(async (m) => {
              const { readdir } = await import('node:fs/promises');
              const dirs = (await readdir('npm', { withFileTypes: true }))
                .filter((e) => e.isDirectory());
              if (dirs.length !== m.TARGETS.length) {
                console.error(
                  'expected ' + m.TARGETS.length + ' platform packages, found ' + dirs.length
                );
                process.exit(1);
              }
              console.error('matrix complete: ' + dirs.length + ' platform packages');
            });
          "

      - name: Publish platform packages
        if: inputs.dry_run != true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          for dir in npm/*/; do
            npm publish "$dir" --access public --provenance
          done

      # Only now is it safe: every optionalDependency the root declares is live.
      - name: Publish root package
        if: inputs.dry_run != true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  # Stage 3a: build a standalone SEA binary per platform, on its own runner.
  # SEA cannot cross-compile — the base binary is the runner's own `node`, so
  # each artifact must be produced on a host of that platform.
  sea:
    name: sea ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runner: ubuntu-22.04
          - label: darwin-x64
            runner: macos-13
          - label: darwin-arm64
            runner: macos-14
          - label: win-x64
            runner: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build standalone binary
        run: node scripts/build-sea.js --label ${{ matrix.label }}

      # Smoke-test the artifact before it ships: a binary that packs but cannot
      # even print its version is worse than no binary at all.
      - name: Smoke-test the binary (unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x "dist/sea/toris-${{ matrix.label }}"
          "./dist/sea/toris-${{ matrix.label }}" --version
      - name: Smoke-test the binary (windows)
        if: runner.os == 'Windows'
        run: ./dist/sea/toris-${{ matrix.label }}.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: sea-${{ matrix.label }}
          path: |
            dist/sea/toris-${{ matrix.label }}*
          if-no-files-found: error
          retention-days: 7

  # Stage 3b: attach the SEA binaries, their checksums and the installer to the
  # GitHub Release the tag created. Skipped on a manual dry run.
  github-release:
    name: attach binaries to the release
    needs: sea
    if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: sea-*
          path: dist/sea
          merge-multiple: true

      - name: Combine checksums
        run: |
          cd dist/sea
          cat *.sha256 > checksums.txt
          cat checksums.txt

      - name: Attach assets to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sea/toris-*
            dist/sea/checksums.txt
            scripts/install.sh
          fail_on_unmatched_files: true
