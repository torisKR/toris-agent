name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # No `npm ci` step on purpose: toris-agent has zero runtime dependencies
      # and ships no lockfile, so there is nothing to install.
      - name: Syntax check
        run: npm run lint

      - name: Unit tests
        run: npm test

  pack:
    name: package installs and runs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Inspect tarball contents
        run: npm pack --dry-run

      - name: Install globally from the tarball
        run: |
          npm pack
          npm install -g ./toris-agent-0.1.0.tgz

      - name: Smoke test the installed CLI
        run: |
          toris --version
          toris doctor
