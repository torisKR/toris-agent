[package]
name = "toris-desktop"
version = "0.1.0"
description = "toris — a ChatGPT-like desktop copilot for solo entrepreneurs, backed by the toris agent chat engine."
authors = ["toris"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

# The library the Tauri mobile/desktop entrypoints link against.
[lib]
name = "toris_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
